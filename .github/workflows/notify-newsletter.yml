name: Notify Newsletter

# Send newsletters only once the post is actually live. Vercel reports every
# deployment back to GitHub; we act on a *successful Production* deployment, so
# an email can never link to a page that hasn't deployed yet (pushes and Vercel
# deploys are separate systems and the deploy can lag the push).
# send-newsletter.tsx skips posts that were already sent, so running on every
# production deploy is safe.
on:
  workflow_dispatch:
  deployment_status:

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          # The exact commit Vercel just deployed (falls back to the default
          # branch for manual runs).
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Send newsletter for new posts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_NEWSLETTER_AUDIENCE_ID: ${{ secrets.RESEND_NEWSLETTER_AUDIENCE_ID }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          BASE_URL: ${{ vars.BASE_URL || 'https://namespace.ninja' }}
        run: npx tsx scripts/send-newsletter.tsx
